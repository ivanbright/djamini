<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Djamini{% endblock %}</title>
  <style>
    :root { --fg: #1f2933; --muted: #7b8794; --line: #e4e7eb; --accent: #2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: var(--fg); }
    header { border-bottom: 1px solid var(--line); padding: 0.9rem 1.5rem;
             display: flex; align-items: center; gap: 1.25rem; }
    header strong { font-size: 1.05rem; }
    header nav { display: flex; gap: 1rem; align-items: center; margin-left: auto; }
    main { max-width: 820px; margin: 2rem auto; padding: 0 1.5rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.6rem 0.4rem; border-bottom: 1px solid var(--line); }
    .muted { color: var(--muted); }
    .actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    button, .button { font: inherit; cursor: pointer; border: 1px solid var(--line);
                      background: #fff; padding: 0.45rem 0.9rem; border-radius: 6px; }
    .button.primary, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .button.danger, button.danger { color: #b91c1c; border-color: #fca5a5; }
    .messages { list-style: none; padding: 0; }
    .messages li { background: #ecfdf5; border: 1px solid #a7f3d0; padding: 0.6rem 0.9rem; border-radius: 6px; }
    form p { margin: 0.75rem 0; }
    input, textarea { font: inherit; padding: 0.4rem; width: 100%; border: 1px solid var(--line); border-radius: 6px; }
    dl { display: grid; grid-template-columns: 140px 1fr; gap: 0.5rem 1rem; }
    dt { color: var(--muted); }
    dd { margin: 0; }
  </style>
</head>
<body>
  <header>
    <strong><a href="{% url 'vault:license_list' %}">Djamini</a></strong>
    <span class="muted">your licenses, in one place</span>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'vault:license_create' %}">New license</a>
        <span class="muted">{{ user.username }}</span>
        <form action="{% url 'accounts:logout' %}" method="post" style="display:inline">
          {% csrf_token %}
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">Log in</a>
        <a href="{% url 'accounts:register' %}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
