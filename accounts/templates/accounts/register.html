{% extends 'base.html' %}

{% block title %}Register · Djamini{% endblock %}

{% block content %}
<h1>Create account</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="actions">
    <button class="primary" type="submit">Register</button>
    <a class="button" href="{% url 'accounts:login' %}">Already have an account?</a>
  </div>
</form>
{% endblock %}
