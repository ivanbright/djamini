{% extends 'base.html' %}

{% block title %}Log in · Djamini{% endblock %}

{% block content %}
<h1>Log in</h1>

{% if form.errors %}
  <p class="muted">Your username and password did not match.</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="actions">
    <button class="primary" type="submit">Log in</button>
    <a class="button" href="{% url 'accounts:register' %}">Create account</a>
  </div>
</form>
{% endblock %}
